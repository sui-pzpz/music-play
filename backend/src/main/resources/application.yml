server:
  port: 8080

spring:
  application:
    name: music-play-backend
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

jwt:
  secret: YTk1ZjNiYzE4ZjQ1NmI3YzhkOTJhM2I2YzBkZjE4ZjQ1NmI3YzhkOTJhM2I2Yw==
  expiration: 7200
  refresh-expiration: 2592000